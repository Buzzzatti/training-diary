:root{color-scheme:dark;--bg:#0c121b;--card:#192433;--edge:#2b3b4c;--text:#f1f6fb;--muted:#9caec1;--accent:#9aefb8;--orange:#ffc481}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(95px + env(safe-area-inset-bottom))}header{padding:20px 4px 12px}h1{margin:0;font-size:27px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.45;margin:8px 0}.sub{font-size:13px;color:var(--muted)}.nav{display:flex;gap:5px;position:sticky;top:0;z-index:5;background:#0c121bf5;padding:8px 0 12px}.nav button{flex:1;padding:10px 3px;font-size:12px}.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:15px;margin:11px 0}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.flex>*{flex:1}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;border-radius:50px;background:#294334;color:var(--accent);padding:5px 9px;font-size:12px}.orange{color:var(--orange)}button,input,select,textarea{font:inherit;border-radius:10px}button{background:#283749;border:1px solid #40556a;color:white;padding:10px 12px;cursor:pointer}button.primary{background:var(--accent);color:#092018;border-color:var(--accent);font-weight:700}button.active{color:var(--accent);border-color:var(--accent)}button.small{font-size:12px;padding:7px 9px}button.danger{color:#ffb2b2}input,select,textarea{background:#101a26;border:1px solid #43576c;color:white;padding:10px;min-width:0;width:100%}input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}input[type=number]{appearance:textfield}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:12px;background:#111c29;border-radius:12px}.metric strong{display:block;font-size:22px;margin-top:5px}.metric span{font-size:12px;color:var(--muted)}.setgrid{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) 53px 29px;gap:5px;align-items:center;margin:10px 0}.setgrid label{font-size:11px;color:var(--muted);text-align:center}.setgrid input{text-align:center;padding:9px 2px}.setgrid input[type=checkbox]{justify-self:center}.exercise{border-left:3px solid #79c89a}.exercise .sub{margin:6px 0}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0c121bf2;border-top:1px solid var(--edge);z-index:6}.bottom button{width:100%}.tiny{font-size:12px}.muted{color:var(--muted)}.chart{width:100%;height:145px;background:#101a26;border-radius:10px}.chart text{fill:#b6c6d5;font-size:10px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}textarea{min-height:65px;resize:vertical}.divider{border:0;border-top:1px solid var(--edge);margin:14px 0}.timer{font-size:35px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center;margin:8px}.toast{position:fixed;top:12px;left:10%;width:80%;padding:12px;background:#254536;border:1px solid var(--accent);border-radius:12px;text-align:center;z-index:20}.progress{height:8px;background:#334253;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.tag{font-size:11px;color:var(--orange)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:370px){.nav button{font-size:11px}.setgrid{grid-template-columns:19px minmax(0,1fr) minmax(0,1fr) 45px 25px}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111827"><link rel="icon" href="icon.svg" type="image/svg+xml"></head><body><header><h1>🏋️ Сила <span class="pill">2.0</span></h1><p>Рекомпозиция · 3 дня в неделю · сила 70% / функционал 30%</p></header><nav class="nav"><button id="nav-train" class="active" onclick="show('train')">🏋️ Зал</button><button id="nav-plan" onclick="show('plan')">🧩 План</button><button id="nav-progress" onclick="show('progress')">📈 Прогресс</button><button id="nav-history" onclick="show('history')">🗂 История</button><button id="nav-settings" onclick="show('settings')">⚙️</button></nav><main id="train"></main><main id="plan" class="hidden"></main><main id="progress" class="hidden"></main><main id="history" class="hidden"></main><main id="settings" class="hidden"></main><div class="bottom" id="bottom"><button class="primary" onclick="saveWorkout()">✓ Завершить и сохранить тренировку</button></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';const K='strength-diary-v2',OLD='training-diary-v1';const mk=(name,n,range,rest=120)=>({id:'ex'+Math.random().toString(36).slice(2,9),name,n,range,rest});const defaults=[{name:'А · Присед + грудь',items:[mk('Приседания со штангой',4,'5–6',180),mk('Жим гантелей лёжа',4,'6–10',150),mk('Подтягивания',4,'6–10',150),mk('Болгарские выпады',3,'8–10',90),mk('Подъём гири перед собой',3,'10–12',75),mk('Скручивания с весом',3,'12–15',60)],finisher:{type:'AMRAP',minutes:8,description:'10 махов гирей · 8 берпи · 12 приседаний без веса'}},{name:'Б · Становая + спина',items:[mk('Становая тяга',4,'4–6',210),mk('Жим штанги стоя',4,'6–8',150),mk('Подтягивания обратным хватом',3,'6–10',120),mk('Горизонтальная тяга блока',3,'8–12',90),mk('Боковые наклоны с гирей',3,'10–12 / сторона',75),mk('Подъём коленей в висе',3,'10–15',60)],finisher:{type:'EMOM',minutes:10,description:'Нечётная минута: 12 махов гирей · чётная: 10 ккал на гребле'}},{name:'В · Ноги + функционал',items:[mk('Жим ногами',3,'10–12',150),mk('Жим гантелей под наклоном',3,'8–10',120),mk('Подтягивания с весом / без',4,'6–8',150),mk('Румынская тяга',3,'8',150),mk('Переноска гири одной рукой',3,'30–40 м / сторона',75),mk('Скручивания сидя с гантелью',3,'16–20',60)],finisher:{type:'КРУГИ',minutes:10,description:'3 круга: 15 махов гирей · 10 отжиманий · 15 ккал на велотренажёре'}}];const initial={version:2,plan:defaults,records:[],body:[],startDate:new Date().toLocaleDateString('en-CA'),draft:null,legacyImported:false};let db;try{db=Object.assign({},initial,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){db=structuredClone(initial)}if(!Array.isArray(db.plan)||db.plan.length!==3)db.plan=defaults;if(!Array.isArray(db.records))db.records=[];if(!Array.isArray(db.body))db.body=[];let active='train',restEnd=0,restHandle=null,finEnd=0,finHandle=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Не удалось сохранить данные. Сделай резервную копию.')}}function notify(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function blank(day=0){return {date:new Date().toLocaleDateString('en-CA'),day,started:Date.now(),notes:'',finisherResult:'',sets:{}}}if(!db.draft)db.draft=blank();function ensure(ex){let d=db.draft.sets;if(!d[ex.id])d[ex.id]=Array.from({length:ex.n},()=>({weight:'',reps:'',rpe:'',done:false}));return d[ex.id]}function show(name){active=name;['train','plan','progress','history','settings'].forEach(t=>{$(t).classList.toggle('hidden',t!==name);$('nav-'+t).classList.toggle('active',t===name)});$('bottom').classList.toggle('hidden',name!=='train');render()};function render(){({train:renderTrain,plan:renderPlan,progress:renderProgress,history:renderHistory,settings:renderSettings})[active]()}function currentWeek(){return Math.max(1,Math.min(12,Math.floor((new Date()-new Date(db.startDate+'T00:00:00'))/604800000)+1))}function phase(){let w=currentWeek();return w<=2?'Адаптация · запас 3–4 повтора':w<=6?'Возвращение силы · запас 2–3 повтора':w<=10?'Прогресс · запас 1–2 повтора':'Контроль прогресса · по самочувствию'}function lastSet(name){for(const r of db.records){const e=(r.exercises||[]).find(x=>x.name===name);if(e){const s=(e.sets||[]).filter(s=>s.done&&s.reps);if(s.length)return s.map(x=>`${x.weight||'—'}×${x.reps}`).join(' · ')}}return 'пока нет'}function renderTrain(){let d=db.draft,p=db.plan[d.day],html=`<div class="card"><div class="between"><h2>Тренировка</h2><span class="pill">Неделя ${currentWeek()} / 12</span></div><div class="row"><select id="trainingDay" onchange="setDay(this.value)">${db.plan.map((x,i)=>`<option value="${i}" ${d.day===i?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input type="date" value="${esc(d.date)}" onchange="draftField('date',this.value)"></div><p class="sub">${phase()}. Перед базовыми движениями сделай разминку и разминочные подходы.</p></div><div class="card"><div class="between"><h3>⏱ Отдых между подходами</h3><span id="restClock" class="pill">Готов</span></div><div class="flex"><button class="small" onclick="startRest(60)">1:00</button><button class="small" onclick="startRest(90)">1:30</button><button class="small" onclick="startRest(120)">2:00</button><button class="small" onclick="startRest(180)">3:00</button><button class="small" onclick="stopRest()">Стоп</button></div></div>`;p.items.forEach((ex,i)=>{const sets=ensure(ex);html+=`<section class="card exercise"><div class="between"><h3>${esc(ex.name)}</h3><span class="pill">${esc(ex.range)}</span></div><div class="sub">Прошлый раз: <span class="orange">${esc(lastSet(ex.name))}</span> · отдых ${ex.rest} сек</div><div class="setgrid"><label>№</label><label>Кг</label><label>Повт.</label><label>RPE</label><label>✓</label>${sets.map((s,j)=>`<span class="tiny">${j+1}</span><input type="number" step="0.5" min="0" inputmode="decimal" aria-label="Вес" value="${esc(s.weight)}" onchange="setVal('${ex.id}',${j},'weight',this.value)"><input type="number" min="0" inputmode="numeric" aria-label="Повторения" value="${esc(s.reps)}" onchange="setVal('${ex.id}',${j},'reps',this.value)"><input type="number" min="1" max="10" step="0.5" inputmode="decimal" aria-label="RPE" value="${esc(s.rpe)}" onchange="setVal('${ex.id}',${j},'rpe',this.value)"><input type="checkbox" aria-label="Подход выполнен" ${s.done?'checked':''} onchange="setVal('${ex.id}',${j},'done',this.checked,${ex.rest})">`).join('')}</div><div class="flex"><button class="small" onclick="changeSet('${ex.id}',1)">+ Подход</button><button class="small" onclick="changeSet('${ex.id}',-1)">− Подход</button><button class="small" onclick="replaceExercise(${i})">Заменить</button></div></section>`});html+=`<div class="card"><h2>⚡ Финишер · ${esc(p.finisher.type)}</h2><p>${esc(p.finisher.description)}</p><div class="timer" id="finClock">${String(p.finisher.minutes).padStart(2,'0')}:00</div><div class="flex"><button class="primary" onclick="startFinisher()">Старт</button><button onclick="stopFinisher()">Стоп</button></div><p class="sub">Первые 2 недели — умеренный темп, можно сократить финишер или пропустить.</p><input placeholder="Результат: круги, повторения, калории..." value="${esc(d.finisherResult)}" onchange="draftField('finisherResult',this.value)"></div><div class="card"><h2>Заметки</h2><textarea placeholder="Самочувствие, техника, ощущения..." oninput="draftField('notes',this.value)">${esc(d.notes)}</textarea></div>`;$('train').innerHTML=html;updateClocks()}
function draftField(k,v){db.draft[k]=v;persist()}function setDay(v){if(!confirm('Переключить тренировку? Заполненные подходы сохранятся в черновике.')){renderTrain();return}db.draft.day=+v;persist();renderTrain()}function setVal(id,j,k,v,rest){let ex=db.plan.flatMap(p=>p.items).find(e=>e.id===id);if(!ex)return;ensure(ex)[j][k]=v;persist();if(k==='done'&&v)startRest(rest||ex.rest)}function changeSet(id,delta){let ex=db.plan.flatMap(p=>p.items).find(e=>e.id===id),arr=ensure(ex);if(delta>0)arr.push({weight:'',reps:'',rpe:'',done:false});else if(arr.length>1)arr.pop();persist();renderTrain()}function replaceExercise(i){const ex=db.plan[db.draft.day].items[i];let name=prompt('Название упражнения вместо «'+ex.name+'»',ex.name);if(!name||!name.trim())return;ex.name=name.trim();persist();renderTrain()}function saveWorkout(){let d=db.draft,p=db.plan[d.day],exercises=p.items.map(e=>({name:e.name,sets:ensure(e).map(s=>({...s}))}));if(!exercises.some(e=>e.sets.some(s=>s.done))&&!confirm('Нет отмеченных выполненных подходов. Сохранить?'))return;let r={id:Date.now(),date:d.date,day:d.day,dayName:p.name,minutes:Math.max(1,Math.round((Date.now()-d.started)/60000)),notes:d.notes,finisherResult:d.finisherResult,finisher:{...p.finisher},exercises};db.records.unshift(r);db.draft=blank((d.day+1)%3);persist();stopRest();stopFinisher();notify('Тренировка сохранена ✓');renderTrain()}
function renderPlan(){$('plan').innerHTML=`<div class="card"><h2>12 недель возвращения</h2><p>Неделя ${currentWeek()} · ${phase()}</p><div class="progress"><div style="width:${currentWeek()/12*100}%"></div></div><p class="sub">Не нужно проверять максимумы после перерыва. Прибавляй вес, когда все подходы сделаны в нужном диапазоне с запасом и хорошей техникой.</p><label class="sub">Дата начала программы</label><input type="date" value="${esc(db.startDate)}" onchange="db.startDate=this.value;persist();renderPlan()"></div>`+db.plan.map((p,i)=>`<div class="card"><div class="between"><h2>${esc(p.name)}</h2><button class="small" onclick="editDayName(${i})">Переименовать</button></div>${p.items.map((e,j)=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--edge)"><div><strong>${esc(e.name)}</strong><div class="sub">${e.n} × ${esc(e.range)} · ${e.rest} сек</div></div><button class="small" onclick="editExercise(${i},${j})">✎</button><button class="small danger" onclick="removeExercise(${i},${j})">×</button></div>`).join('')}<div class="flex" style="margin-top:12px"><button class="small primary" onclick="addExercise(${i})">+ Упражнение</button><button class="small" onclick="editFinisher(${i})">⚡ Финишер</button></div><p class="sub">${esc(p.finisher.type)} · ${esc(p.finisher.minutes)} мин: ${esc(p.finisher.description)}</p></div>`).join('')}
function editDayName(i){let v=prompt('Название дня',db.plan[i].name);if(v?.trim()){db.plan[i].name=v.trim();persist();renderPlan()}}function editExercise(i,j){let e=db.plan[i].items[j],name=prompt('Название',e.name);if(name===null||!name.trim())return;let n=prompt('Количество подходов',e.n);if(n===null)return;let range=prompt('Повторения / дистанция',e.range);if(range===null)return;let rest=prompt('Отдых в секундах',e.rest);if(rest===null)return;Object.assign(e,{name:name.trim(),n:Math.max(1,Math.min(12,+n||e.n)),range:range.trim(),rest:Math.max(15,+rest||e.rest)});persist();renderPlan()}function addExercise(i){let name=prompt('Название нового упражнения');if(!name?.trim())return;db.plan[i].items.push(mk(name.trim(),3,'8–12',90));persist();renderPlan()}function removeExercise(i,j){if(confirm('Удалить упражнение из программы?')){db.plan[i].items.splice(j,1);persist();renderPlan()}}function editFinisher(i){let f=db.plan[i].finisher,type=prompt('Тип: AMRAP / EMOM / КРУГИ',f.type);if(type===null)return;let m=prompt('Минуты',f.minutes);if(m===null)return;let description=prompt('Описание комплекса',f.description);if(description===null)return;Object.assign(f,{type:type.trim(),minutes:Math.max(1,+m||10),description});persist();renderPlan()}
function renderHistory(){$('history').innerHTML=db.records.length?db.records.map(r=>`<div class="card"><div class="between"><h2>${esc(r.date)} · ${esc(r.dayName||['А','Б','В'][r.day]||'Тренировка')}</h2><button class="small danger" onclick="deleteWorkout(${r.id})">Удалить</button></div><p class="sub">${r.minutes||'—'} мин · ${countTonnage(r)} кг тоннаж</p>${(r.exercises||[]).map(e=>`<p><strong>${esc(e.name)}</strong><br><span class="sub">${(e.sets||[]).filter(s=>s.done).map(s=>`${esc(s.weight||'0')} кг × ${esc(s.reps||'—')}${s.rpe?' · RPE '+esc(s.rpe):''}`).join(' / ')||'Нет выполненных подходов'}</span></p>`).join('')}${r.finisherResult?`<p>⚡ ${esc(r.finisherResult)}</p>`:''}${r.notes?`<p>${esc(r.notes)}</p>`:''}</div>`).join(''):'<div class="card"><h2>История пуста</h2><p>Заверши первую тренировку — здесь появятся подходы и веса.</p></div>'}function deleteWorkout(id){if(confirm('Безвозвратно удалить тренировку?')){db.records=db.records.filter(r=>r.id!==id);persist();renderHistory()}}function countTonnage(r){return Math.round((r.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).reduce((s,x)=>s+(x.done?(+x.weight||0)*(+x.reps||0):0),0),0))}
function renderProgress(){let body=[...db.body].sort((a,b)=>a.date.localeCompare(b.date));let names=[...new Set(db.records.flatMap(r=>(r.exercises||[]).map(e=>e.name)))];let selected=window.chartEx||names[0]||'';if(!names.includes(selected))selected=names[0]||'';let points=[...db.records].reverse().flatMap(r=>(r.exercises||[]).filter(e=>e.name===selected).map(e=>({date:r.date,value:Math.max(0,...(e.sets||[]).filter(s=>s.done).map(s=>+s.weight||0))}))).filter(x=>x.value>0);let latest=body.at(-1);$('progress').innerHTML=`<div class="card"><h2>📏 Измерения тела</h2><div class="grid"><div class="metric"><span>Вес</span><strong>${latest?.weight??'88'} кг</strong></div><div class="metric"><span>Талия</span><strong>${latest?.waist??'90'} см</strong></div></div><p class="sub">Базовые ориентиры после перерыва: 88 кг и талия 90 см. Цель по талии — около 85 см.</p><div class="two"><label class="sub">Дата<input id="bodyDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"></label><label class="sub">Вес, кг<input id="bodyWeight" type="number" step="0.1" placeholder="88"></label><label class="sub">Талия, см<input id="bodyWaist" type="number" step="0.1" placeholder="90"></label><div style="align-self:end"><button class="primary" style="width:100%" onclick="saveBody()">+ Записать</button></div></div><h3 style="margin-top:18px">Талия</h3>${svgChart(body.filter(x=>x.waist).map(x=>({date:x.date,value:+x.waist})), 'см')}<h3 style="margin-top:18px">Вес</h3>${svgChart(body.filter(x=>x.weight).map(x=>({date:x.date,value:+x.weight})), 'кг')}<div class="sub">${body.slice().reverse().slice(0,8).map(x=>`<div class="between" style="padding:7px 0">${esc(x.date)} · ${esc(x.weight||'—')} кг · ${esc(x.waist||'—')} см <button class="small danger" onclick="deleteBody('${esc(x.date)}')">×</button></div>`).join('')}</div></div><div class="card"><h2>🏆 Силовые показатели</h2><p class="sub">Прежние ориентиры: присед 100×8; становая ~120 кг; жим гантелей 32×10; жим ногами 200–220×10–12.</p><select onchange="window.chartEx=this.value;renderProgress()">${names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select>${svgChart(points,'кг')}<p class="sub">График показывает максимальный рабочий вес за тренировку, не расчётный 1ПМ. Вес гантели записывай для одной руки, одинаково во всех тренировках.</p></div><div class="card"><h2>📊 Общая статистика</h2><div class="grid"><div class="metric"><span>Тренировок</span><strong>${db.records.length}</strong></div><div class="metric"><span>Тоннаж всего</span><strong>${Math.round(db.records.reduce((a,r)=>a+countTonnage(r),0)).toLocaleString('ru-RU')} кг</strong></div></div></div>`}
function svgChart(points,unit){if(!points.length)return '<p class="sub">Пока нет измерений — добавь первую запись.</p>';let values=points.map(p=>p.value),min=Math.min(...values),max=Math.max(...values),pad=Math.max(1,(max-min)*.2),lo=min-pad,hi=max+pad;let coords=points.map((p,i)=>({x:points.length===1?170:22+i*296/(points.length-1),y:120-(p.value-lo)/(hi-lo)*96}));let path=coords.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');return `<svg class="chart" viewBox="0 0 340 145" role="img" aria-label="График ${esc(unit)}"><line x1="18" y1="120" x2="322" y2="120" stroke="#405166"/><path d="${path}" fill="none" stroke="#9aefb8" stroke-width="3" stroke-linecap="round"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#9aefb8"><title>${esc(points[i].date)}: ${points[i].value} ${esc(unit)}</title></circle>`).join('')}<text x="20" y="14">${max} ${esc(unit)}</text><text x="20" y="139">${esc(points[0].date)}</text><text x="318" y="139" text-anchor="end">${esc(points.at(-1).date)}</text></svg>`}function saveBody(){let date=$('bodyDate').value,w=$('bodyWeight').value,t=$('bodyWaist').value;if(!date||(!w&&!t))return alert('Укажи дату и хотя бы один показатель');if((w&&(+w<=0||+w>500))||(t&&(+t<=0||+t>300)))return alert('Проверь значения');db.body=db.body.filter(x=>x.date!==date);db.body.push({date,weight:w?+w:null,waist:t?+t:null});persist();renderProgress();notify('Замер сохранён')}function deleteBody(date){if(confirm('Удалить замер за '+date+'?')){db.body=db.body.filter(x=>x.date!==date);persist();renderProgress()}}
function renderSettings(){let old=[];try{old=JSON.parse(localStorage.getItem(OLD)||'[]')}catch(e){}$('settings').innerHTML=`<div class="card"><h2>💾 Резервная копия</h2><p>Записи сохраняются только в хранилище браузера на этом устройстве. При открытии HTML как нового файла хранилище может быть другим. Регулярно экспортируй JSON.</p><div class="flex"><button class="primary" onclick="exportBackup()">⬇ Экспорт JSON</button><button onclick="$('importFile').click()">⬆ Импорт JSON</button></div><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importBackup(event)"></div><div class="card"><h2>🔁 Старый дневник</h2><p>Если версия 1.0 и эта версия открыты в одном браузере и в одном хранилище, можно перенести историю.</p><p class="sub">Найдено записей v1: ${old.length}</p><button onclick="migrateOld()" ${!old.length?'disabled':''}>Импортировать старые тренировки</button></div><div class="card"><h2>⚙️ Как пользоваться</h2><p>Сначала выбери день А, Б или В. Вписывай вес, повторы и RPE (1–10), отмечай выполненные подходы. Галочка запускает таймер отдыха. В конце нажми «Завершить и сохранить».</p><p>RPE 7 ≈ 3 повтора в запасе, RPE 8 ≈ 2, RPE 9 ≈ 1. Первые две недели после перерыва избегай отказа и работай с меньшим объёмом.</p><p>Чтобы редактировать план, открой «План». Прогресс и замеры — в разделе «Прогресс».</p></div><div class="card"><h2>🧹 Сброс</h2><button class="danger" onclick="resetDraft()">Очистить текущую тренировку</button></div>`}function resetDraft(){if(confirm('Очистить незавершённую тренировку?')){db.draft=blank(db.draft.day);persist();notify('Черновик очищен')}}function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sila-diary-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function importBackup(ev){let f=ev.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.version!==2||!Array.isArray(obj.records)||!Array.isArray(obj.plan)||!Array.isArray(obj.body))throw Error('Ожидается резервная копия версии 2');if(!confirm('Заменить ВСЕ текущие данные резервной копией?'))return;db=obj;persist();notify('Данные восстановлены');render()}catch(e){alert('Ошибка импорта: '+e.message)}ev.target.value=''}function migrateOld(){let old;try{old=JSON.parse(localStorage.getItem(OLD)||'[]')}catch(e){return alert('Ошибка чтения старого дневника')}if(!Array.isArray(old)||!old.length)return;let existing=new Set(db.records.map(r=>'old-'+r.id));let add=old.filter(r=>!existing.has('old-'+r.id)).map(r=>({...r,id:'old-'+r.id,dayName:['А · прежняя программа','Б · прежняя программа','В · прежняя программа'][r.day]||'Прежняя программа',minutes:null}));db.records.push(...add);db.records.sort((a,b)=>String(b.date).localeCompare(String(a.date)));persist();notify('Перенесено записей: '+add.length);renderSettings()}
function startRest(sec){restEnd=Date.now()+sec*1000;if(restHandle)clearInterval(restHandle);restHandle=setInterval(updateClocks,250);updateClocks()}function stopRest(){restEnd=0;if(restHandle)clearInterval(restHandle);restHandle=null;updateClocks()}function startFinisher(){finEnd=Date.now()+db.plan[db.draft.day].finisher.minutes*60000;if(finHandle)clearInterval(finHandle);finHandle=setInterval(updateClocks,250);updateClocks()}function stopFinisher(){finEnd=0;if(finHandle)clearInterval(finHandle);finHandle=null;updateClocks()}function clock(ms){let sec=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function updateClocks(){let a=$('restClock'),b=$('finClock');if(a)a.textContent=restEnd?clock(restEnd-Date.now()):'Готов';if(b)b.textContent=finEnd?clock(finEnd-Date.now()):clock(db.plan[db.draft.day].finisher.minutes*60000);if(restEnd&&Date.now()>=restEnd){restEnd=0;if(restHandle)clearInterval(restHandle);restHandle=null;if(navigator.vibrate)navigator.vibrate([150,100,150]);notify('Отдых завершён')}if(finEnd&&Date.now()>=finEnd){finEnd=0;if(finHandle)clearInterval(finHandle);finHandle=null;if(navigator.vibrate)navigator.vibrate([250,100,250]);notify('Финишер завершён')}}persist();show('train');
</script></body></html>
